<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const basePath = '%BASE_URL%';
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (
            redirect !== basePath + '/' &&
            redirect !== basePath + '/index.html'
          ) {
            window.history.pushState(null, '', redirect);
          }
        }

        // Apply theme before first paint (mirrors src/core/theme.tsx).
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --boot-bg: #000000;
      }
      html.light,
      html[data-theme='light'] {
        --boot-bg: #f5f5f7;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
    </style>
    <link rel="icon" type="image/png" href="%BASE_URL%/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cycling Page</title>
    <script
      defer
      src="https://umami.guoqi.dev/script.js"
      data-website-id="d63a7353-5696-4d09-8837-72b3d48a7eea"
    ></script>
    <script
      defer
      src="https://umami.guoqi.dev/recorder.js"
      data-website-id="d63a7353-5696-4d09-8837-72b3d48a7eea"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
